site_name: Art-project wiki
site_description: art-project is a Claude Code plugin that scaffolds the pre-studio articulation phase of practice-based artistic research (grant applications, doctoral expositions, residency proposals). Six modes — socratic, provoke, lineage, brief, rehearsal, full — with tradition-tag reference layer and authentic-practice boundaries. Not an ideation engine; the Penny / Ingold / Borgdorff critique that artistic ideation is non-linguistic and material is accepted.
site_author: Joonhyung Bae
site_url: https://joonhyungbae.github.io/art-project/
repo_url: https://github.com/joonhyungbae/art-project
repo_name: joonhyungbae/art-project
copyright: Copyright &copy; 2026 Joonhyung Bae — CC BY-NC 4.0

docs_dir: wiki

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: Art-project wiki
          nav_translations:
            Getting started: Getting started
            Install: Install
            First session: First session
            Modes: Modes
            Overview: Overview
            Socratic: Socratic mode
            Provoke: Provoke mode
            Lineage: Lineage mode
            Brief: Brief mode
            Rehearsal: Rehearsal mode
            Full: Full project file
            Reference: Reference
            Concept Brief schema: Concept Brief schema
            Tradition tags: Tradition tags
            Authentic Practice Boundaries: Authentic Practice Boundaries
            Philosophy: Philosophy
            Cognitive scaffold: Cognitive scaffold
            Frayling typology: Frayling typology
            Measured harms: Measured harms
            Help: Help
            FAQ: FAQ
            Troubleshooting: Troubleshooting
            Worked example: Worked example
            Contributing: Contributing
        - locale: ko
          name: 한국어
          build: true
          site_name: Art-project 위키
          nav_translations:
            Getting started: 시작하기
            Install: 설치
            First session: 첫 세션
            Modes: 모드
            Overview: 개요
            Socratic: Socratic 모드
            Provoke: Provoke 모드
            Lineage: Lineage 모드
            Brief: Brief 모드
            Rehearsal: Rehearsal 모드
            Full: Full 프로젝트 파일
            Reference: 레퍼런스
            Concept Brief schema: Concept Brief 스키마
            Tradition tags: 전통 태그
            Authentic Practice Boundaries: 진정성 실천 경계
            Philosophy: 철학
            Cognitive scaffold: 인지적 스캐폴드
            Frayling typology: Frayling 분류
            Measured harms: 측정 가능한 위해
            Help: 도움말
            FAQ: 자주 묻는 질문
            Troubleshooting: 트러블슈팅
            Worked example: 워크드 예시
            Contributing: 기여

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - First session: getting-started/first-session.md
  - Modes:
      - Overview: modes/overview.md
      - Socratic: modes/socratic.md
      - Provoke: modes/provoke.md
      - Lineage: modes/lineage.md
      - Brief: modes/brief.md
      - Rehearsal: modes/rehearsal.md
      - Full: modes/full.md
  - Reference:
      - Concept Brief schema: reference/concept-brief.md
      - Tradition tags: reference/tradition-tags.md
      - Authentic Practice Boundaries: reference/authentic-practice-boundaries.md
  - Philosophy:
      - Cognitive scaffold: philosophy/cognitive-scaffold.md
      - Frayling typology: philosophy/frayling-typology.md
      - Measured harms: philosophy/measured-harms.md
  - Help:
      - FAQ: help/faq.md
      - Troubleshooting: help/troubleshooting.md
      - Worked example: help/worked-example.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/joonhyungbae/art-project
  alternate:
    - name: English
      link: /
      lang: en
    - name: 한국어
      link: /ko/
      lang: ko
